# Gridworld config with v2 architecture —
# residual blocks, attention world model, cross-attention bridge,
# learned text embeddings. Start with conservative hyperparams
# matching the legacy baseline's tuned weights, then iterate.
seed: 0

env:
  kind: gridworld
  size: 6
  max_steps: 50
  n_walls: 0
  step_penalty: 0.01
  include_goal_in_obs: false

model:
  version: v2
  latent_dim: 96
  lang_dim: 128
  hidden: 256
  num_blocks: 2
  num_heads: 4
  dropout: 0.1

loss:
  dyn: 1.391
  rew: 1.0
  recon: 0.644
  align: 0.934
  cycle: 0.179
  ground: 1.143
  # contrastive starts at 0 — measure baseline v2 without it,
  # then turn it on as a second iteration
  contrastive: 0.0
  contrastive_temp: 0.07

train:
  collect_episodes: 80
  steps: 2500
  batch_size: 128
  lr: 0.00091

control:
  horizon: 5
  n_samples: 256
  gamma: 0.95
  guide_weight: 3.561

planner:
  backend: mock
  model: google/gemma-4-31b-it:free

eval:
  episodes: 50
