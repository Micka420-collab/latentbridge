# Base config = the default architecture. Every key here is a knob Arbor can
# mutate during the continuous search (see loop/search_space.yaml).
seed: 0

env:
  kind: gridworld
  size: 6
  max_steps: 50
  n_walls: 0
  step_penalty: 0.01
  include_goal_in_obs: false   # false = goal given ONLY in language (tests the bridge)

model:                 # tuned 2026-07-02: gridworld 0.5962 -> 0.6772 (verified; align=0 control collapses to -0.42)
  latent_dim: 64
  lang_dim: 256
  hidden: 256

# Loss weights — the heart of the architecture search.
loss:                  # tuned weights (Level-1 search, verified gain)
  dyn: 0.971
  rew: 1.0
  recon: 0.83385
  align: 0.52095
  cycle: 0.06177
  ground: 1.98257

train:
  collect_episodes: 80
  steps: 2500
  batch_size: 128
  lr: 0.00189          # tuned (was 0.00091)

control:
  horizon: 10          # tuned (was 8)
  n_samples: 1024      # tuned (was 512)
  gamma: 0.95
  guide_weight: 6.61227   # tuned (was 5.0; old search cap was 4.0)

planner:
  backend: mock          # mock | openrouter
  model: google/gemma-4-31b-it:free

eval:
  episodes: 50
